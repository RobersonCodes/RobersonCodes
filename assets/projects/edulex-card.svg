<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">EduLex project card</title>
  <desc id="desc">Multi-tenant education platform built with .NET, CQRS, PostgreSQL and Testcontainers. 52 endpoints and 166 xUnit cases. E2E CI currently needs repair.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#070b0d"/><stop offset="1" stop-color="#07130f"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2bc48a2b"/></pattern>
  </defs>
  <rect width="1200" height="250" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="248" rx="17" fill="none" stroke="#173d31"/>
  <path d="M0 0H10V250H0z" fill="#2bc48a"/>
  <rect width="1200" height="250" rx="18" fill="url(#grid)" opacity=".28"/>
  <text x="52" y="57" fill="#2bc48a" font-family="monospace" font-size="13" font-weight="700" letter-spacing="3">02.02 / SELECTED WORK</text>
  <text x="52" y="125" fill="#f8fafc" font-family="Arial, sans-serif" font-size="48" font-weight="800">EDULEX</text>
  <text x="52" y="159" fill="#9aa7b7" font-family="monospace" font-size="15" letter-spacing="2">MULTI-TENANT EDUCATION PLATFORM</text>
  <g font-family="monospace" font-size="13" font-weight="700">
    <rect x="52" y="190" width="78" height="31" rx="4" fill="#111a18" stroke="#28453d"/><text x="70" y="211" fill="#dce4ee">.NET 8</text>
    <rect x="140" y="190" width="74" height="31" rx="4" fill="#111a18" stroke="#28453d"/><text x="157" y="211" fill="#dce4ee">CQRS</text>
    <rect x="224" y="190" width="111" height="31" rx="4" fill="#111a18" stroke="#28453d"/><text x="240" y="211" fill="#dce4ee">POSTGRESQL</text>
  </g>
  <g transform="translate(735 48)" font-family="monospace">
    <rect width="132" height="112" rx="8" fill="#080f0d" stroke="#183e31"/><text x="18" y="30" fill="#738095" font-size="10" letter-spacing="1.5">ENDPOINTS</text><text x="18" y="77" fill="#f8fafc" font-size="38" font-weight="700">52</text>
    <rect x="146" width="132" height="112" rx="8" fill="#080f0d" stroke="#183e31"/><text x="164" y="30" fill="#738095" font-size="10" letter-spacing="1.5">XUNIT CASES</text><text x="164" y="77" fill="#f8fafc" font-size="38" font-weight="700">166</text>
    <rect x="292" width="132" height="112" rx="8" fill="#080f0d" stroke="#4a351f"/><text x="310" y="30" fill="#738095" font-size="10" letter-spacing="1.5">CI STATUS</text><circle cx="314" cy="72" r="5" fill="#f2b84b"/><text x="328" y="77" fill="#f2c36f" font-size="12" font-weight="700">E2E ISSUE</text>
    <text x="0" y="153" fill="#2bc48a" font-size="12" font-weight="700" letter-spacing="1.5">CODE AVAILABLE ON REQUEST ↗</text>
  </g>
