<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">FinAI Família project card</title>
  <desc id="desc">Family finance copilot built with Next.js, .NET and PostgreSQL. 30 endpoints, 104 automated tests and passing CI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#060a0e"/><stop offset="1" stop-color="#071317"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#31c7d72b"/></pattern>
  </defs>
  <rect width="1200" height="250" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="248" rx="17" fill="none" stroke="#153943"/>
  <path d="M0 0H10V250H0z" fill="#31c7d7"/>
  <rect width="1200" height="250" rx="18" fill="url(#grid)" opacity=".28"/>
  <text x="52" y="57" fill="#31c7d7" font-family="monospace" font-size="13" font-weight="700" letter-spacing="3">02.03 / SELECTED WORK</text>
  <text x="52" y="125" fill="#f8fafc" font-family="Arial, sans-serif" font-size="48" font-weight="800">FINAI FAMÍLIA</text>
  <text x="52" y="159" fill="#9aa7b7" font-family="monospace" font-size="15" letter-spacing="2">FAMILY FINANCE COPILOT</text>
  <g font-family="monospace" font-size="13" font-weight="700">
    <rect x="52" y="190" width="91" height="31" rx="4" fill="#10191d" stroke="#28434a"/><text x="68" y="211" fill="#dce4ee">NEXT.JS</text>
    <rect x="153" y="190" width="78" height="31" rx="4" fill="#10191d" stroke="#28434a"/><text x="171" y="211" fill="#dce4ee">.NET 8</text>
    <rect x="241" y="190" width="111" height="31" rx="4" fill="#10191d" stroke="#28434a"/><text x="257" y="211" fill="#dce4ee">POSTGRESQL</text>
  </g>
  <g transform="translate(735 48)" font-family="monospace">
    <rect width="132" height="112" rx="8" fill="#081014" stroke="#173942"/><text x="18" y="30" fill="#738095" font-size="10" letter-spacing="1.5">ENDPOINTS</text><text x="18" y="77" fill="#f8fafc" font-size="38" font-weight="700">30</text>
    <rect x="146" width="132" height="112" rx="8" fill="#081014" stroke="#173942"/><text x="164" y="30" fill="#738095" font-size="10" letter-spacing="1.5">TESTS</text><text x="164" y="77" fill="#f8fafc" font-size="38" font-weight="700">104</text>
    <rect x="292" width="132" height="112" rx="8" fill="#081014" stroke="#173942"/><text x="310" y="30" fill="#738095" font-size="10" letter-spacing="1.5">CI STATUS</text><circle cx="314" cy="72" r="5" fill="#39d98a"/><text x="328" y="77" fill="#70e6a8" font-size="13" font-weight="700">PASSING</text>
    <text x="0" y="153" fill="#31c7d7" font-size="12" font-weight="700" letter-spacing="1.5">LIVE PRODUCT SURFACE ↗</text>
  </g>
