  <text x="40" y="280" fill="#53677f" font-family="monospace" font-size="9" letter-spacing="1.4">AUDITED 2026-08-25 · COUNTS TRACEABLE TO CURRENT ROUTES, TEST DECLARATIONS AND CI</text>
