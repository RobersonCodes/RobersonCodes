    <g transform="translate(365)"><rect width="350" height="96" rx="8" fill="#08101c" stroke="#1c3d62"/><text x="20" y="31" fill="#71839a" font-size="11" letter-spacing="1.5">AUTOMATED CHECKS DEFINED</text><text x="20" y="74" fill="#f8fafc" font-size="36" font-weight="700">433</text></g>
    <g transform="translate(730)"><rect width="390" height="96" rx="8" fill="#08101c" stroke="#1c3d62"/><text x="20" y="31" fill="#71839a" font-size="11" letter-spacing="1.5">SELECTED SYSTEMS</text><text x="20" y="74" fill="#f8fafc" font-size="36" font-weight="700">03</text></g>
    <g transform="translate(0 112)"><rect width="350" height="72" rx="8" fill="#07141a" stroke="#164555"/><circle cx="24" cy="36" r="5" fill="#31c7d7"/><text x="42" y="41" fill="#dce8f4" font-size="14" font-weight="700" letter-spacing="1.2">MULTI-TENANCY</text></g>
    <g transform="translate(365 112)"><rect width="350" height="72" rx="8" fill="#07141a" stroke="#164555"/><circle cx="24" cy="36" r="5" fill="#31c7d7"/><text x="42" y="41" fill="#dce8f4" font-size="14" font-weight="700" letter-spacing="1.2">TESTCONTAINERS</text></g>
