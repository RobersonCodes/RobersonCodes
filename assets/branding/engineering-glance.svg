<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Engineering at a glance</title>
  <desc id="desc">Across the three selected projects: 155 API routes, 433 automated checks, three systems, multi-tenancy, Testcontainers and CI/CD.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050910"/><stop offset="1" stop-color="#091220"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3483f61f"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#18324f"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <text x="40" y="42" fill="#4f9cff" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2.5">03 / ENGINEERING AT A GLANCE</text>
  <g transform="translate(40 68)" font-family="monospace">
