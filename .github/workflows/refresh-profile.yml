name: Refresh recent projects

on:
  schedule:
    - cron: "17 09 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [profile-refresh]

permissions:
  contents: write

concurrency:
  group: refresh-profile-readme
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh recent public repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-repositories.mjs

      - name: Commit changes when needed
        run: |
          if git diff --quiet -- README.md; then
            echo "No profile update required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(profile): refresh recent repositories"
          git push
